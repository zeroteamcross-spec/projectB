<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Laporan Mingguan — Siata Mobilindo</title>
<style>
  :root{
    --ink:#16232b;
    --ink-muted:#5b6b74;
    --ink-faint:#8a97a0;
    --primary:#1e81b0;
    --secondary:#17698f;
    --cream:#faf4ed;
    --cream-deep:#f2e9dc;
    --border:#e3ddd0;
    --border-soft:#ece6da;
    --surface:#ffffff;

    --dev-a:#155e91;
    --dev-b:#1fb1a4;
    --dev-bg:#e8f6f4;
    --dev-ink:#0c5c6e;

    --maint-a:#c9660f;
    --maint-b:#eaa93b;
    --maint-bg:#fdf1e2;
    --maint-ink:#8a4a09;

    --ok:#2f855a;
    --ok-bg:#e7f5ec;
    --warn:#b3760f;
    --warn-bg:#fbf0da;
    --wait:#6b7684;
    --wait-bg:#eef1f3;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color:var(--ink);
    background:var(--cream);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:960px;
    margin:0 auto;
    background:var(--surface);
    box-shadow:0 1px 3px rgba(22,35,43,.06);
    min-height:100vh;
  }
  @media (min-width:1000px){
    body{ padding:28px 0; }
    .page{ border-radius:14px; box-shadow:0 12px 40px rgba(22,35,43,.12); min-height:0; }
  }
  h1,h2,h3{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:700;
    margin:0;
  }
  .cover{
    background:
      radial-gradient(900px 360px at 92% -20%, color-mix(in srgb, var(--dev-b) 30%, transparent), transparent 60%),
      radial-gradient(700px 320px at -6% 110%, color-mix(in srgb, var(--maint-b) 26%, transparent), transparent 60%),
      linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
    color:#fff;
    padding:38px 44px 30px;
    position:relative;
    overflow:hidden;
    border-radius:14px 14px 0 0;
  }
  .cover-eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    color:color-mix(in srgb, #fff 78%, var(--dev-b));
    margin-bottom:10px;
  }
  .cover h1{
    font-size:30px;
    line-height:1.15;
    max-width:600px;
  }
  .cover-sub{
    margin-top:10px;
    font-size:14px;
    color:color-mix(in srgb, #fff 88%, transparent);
    max-width:620px;
  }
  .cover-row{
    margin-top:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:relative;
    z-index:1;
  }
  .cover-meta{ display:flex; gap:26px; flex-wrap:wrap; }
  .cover-meta div{ min-width:110px; }
  .cover-meta .k{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:color-mix(in srgb, #fff 70%, transparent);
    font-weight:700;
  }
  .cover-meta .v{
    font-size:13px;
    font-weight:700;
    margin-top:3px;
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .archive-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    color:#fff;
    text-decoration:none;
    background:color-mix(in srgb, #fff 16%, transparent);
    padding:8px 14px;
    border-radius:20px;
    white-space:nowrap;
  }
  .archive-link:hover{ background:color-mix(in srgb, #fff 24%, transparent); }

  .body-pad{ padding:26px 44px 36px; }
  @media (max-width:680px){
    .cover{ padding:28px 22px 24px; }
    .body-pad{ padding:22px 22px 30px; }
  }

  .card-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:8px; }
  @media (max-width:760px){ .card-grid{ grid-template-columns:1fr; } }
  .sum-card{
    border-radius:16px;
    padding:20px 22px;
    color:#fff;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(22,35,43,.12);
  }
  .sum-card.dev{ background:linear-gradient(135deg, var(--dev-a), var(--dev-b)); }
  .sum-card.maint{ background:linear-gradient(135deg, var(--maint-a), var(--maint-b)); }
  .sum-card::after{
    content:"";
    position:absolute;
    right:-40px; bottom:-60px;
    width:170px; height:170px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
  }
  .sum-eyebrow{
    position:relative; z-index:1;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-weight:800;
    color:rgba(255,255,255,.85);
  }
  .sum-count{ position:relative; z-index:1; display:flex; align-items:baseline; gap:9px; margin-top:6px; }
  .sum-count .n{
    font-family: Georgia, serif;
    font-size:42px;
    font-weight:700;
    line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .sum-count .l{ font-size:12.5px; color:rgba(255,255,255,.92); max-width:19ch; line-height:1.4; }
  .sum-desc{ position:relative; z-index:1; margin-top:10px; font-size:12.5px; line-height:1.6; color:rgba(255,255,255,.92); max-width:38ch; }

  .table-wrap{ margin-top:28px; overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  table.tasks{ width:100%; border-collapse:collapse; min-width:640px; }
  table.tasks thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    font-weight:700;
    padding:11px 14px;
    background:var(--cream);
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  table.tasks tbody td{
    padding:11px 14px;
    vertical-align:top;
    border-bottom:1px solid var(--border-soft);
    font-size:13px;
  }
  table.tasks tbody tr:last-child td{ border-bottom:none; }
  table.tasks tbody tr:nth-child(even){ background:color-mix(in srgb, var(--cream) 45%, white); }
  td.no{ font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace; color:var(--ink-faint); font-size:12px; white-space:nowrap; }
  td.task-name{ font-weight:700; color:var(--ink); white-space:nowrap; }
  td.task-detail{ color:var(--ink-muted); }
  .pill{
    display:inline-block;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .pill.dev{ background:var(--dev-bg); color:var(--dev-ink); }
  .pill.maint{ background:var(--maint-bg); color:var(--maint-ink); }
  .pill.done{ background:var(--ok-bg); color:var(--ok); }
  .pill.progress{ background:var(--warn-bg); color:var(--warn); }
  .pill.planned{ background:var(--wait-bg); color:var(--wait); }

  .section-lbl{
    margin:30px 0 10px;
    font-family: Georgia, serif;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-lbl .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .section-lbl.dev .dot{ background:linear-gradient(135deg,var(--dev-a),var(--dev-b)); }
  .section-lbl.maint .dot{ background:linear-gradient(135deg,var(--maint-a),var(--maint-b)); }

  .note{
    margin:22px 0 0;
    padding:12px 16px;
    background:var(--cream);
    border:1px solid var(--border-soft);
    border-radius:8px;
    font-size:12.5px;
    color:var(--ink-muted);
  }
  .note a{ color:var(--secondary); font-weight:600; text-decoration:none; border-bottom:1px dashed color-mix(in srgb, var(--secondary) 45%, transparent); }

  .closing{
    margin-top:26px;
    padding-top:14px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .closing .pass{ color:var(--ok); font-weight:700; }
  code{
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
    background:var(--cream);
    padding:2px 7px;
    border-radius:4px;
    color:var(--secondary);
  }
  .loading, .load-error{ padding:30px 0; text-align:center; color:var(--ink-faint); font-size:13px; }
</style>
</head>
<body>
<div class="page">

  <div class="cover">
    <div class="cover-eyebrow">Siata Mobilindo &middot; carlynk.id</div>
    <h1>Laporan Pekerjaan Mingguan</h1>
    <div class="cover-sub">Ringkasan tugas Development &amp; Maintenance yang dikerjakan minggu ini. Riwayat lengkap sejak awal proyek ada di halaman arsip.</div>
    <div class="cover-row">
      <div class="cover-meta" id="cover-meta"></div>
      <a class="archive-link" href="laporan-verifikasi-arsip.html">Lihat arsip lengkap &rarr;</a>
    </div>
  </div>

  <div class="body-pad" id="report-root">
    <div class="loading">Memuat laporan&hellip;</div>
  </div>

</div>

<script>
(function () {
  var root = document.getElementById("report-root");
  var coverMeta = document.getElementById("cover-meta");

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function statusLabel(status) {
    if (status === "progress") return "Berjalan";
    if (status === "planned") return "Berikutnya";
    return "Selesai";
  }

  function statusClass(status) {
    if (status === "progress") return "progress";
    if (status === "planned") return "planned";
    return "done";
  }

  function summaryCard(kind, label, group) {
    return (
      '<div class="sum-card ' + kind + '">' +
        '<div class="sum-eyebrow">' + escapeHtml(label) + '</div>' +
        '<div class="sum-count"><span class="n">' + escapeHtml(group.count) + '</span><span class="l">' + escapeHtml(group.label) + '</span></div>' +
        '<div class="sum-desc">' + escapeHtml(group.description) + '</div>' +
      '</div>'
    );
  }

  function taskRows(rows, kind, kindLabel) {
    return rows.map(function (row, index) {
      var status = row.status || "done";
      var statusCell = '<td><span class="pill ' + statusClass(status) + '">' + statusLabel(status) + '</span></td>';
      return (
        '<tr>' +
          '<td class="no">' + String(index + 1).padStart(2, "0") + '</td>' +
          '<td><span class="pill ' + kind + '">' + escapeHtml(kindLabel) + '</span></td>' +
          '<td class="task-name">' + escapeHtml(row.task) + '</td>' +
          '<td class="task-detail">' + escapeHtml(row.detail) + '</td>' +
          statusCell +
        '</tr>'
      );
    }).join("");
  }

  fetch("laporan-data.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      coverMeta.innerHTML =
        '<div><div class="k">Periode</div><div class="v">' + escapeHtml(data.week_range) + '</div></div>' +
        '<div><div class="k">Cabang</div><div class="v">' + escapeHtml(data.branch) + '</div></div>' +
        '<div><div class="k">Automated test</div><div class="v">' + escapeHtml(data.tests) + '</div></div>';

      var totalTasks = (data.development.count || 0) + (data.maintenance.count || 0);

      root.innerHTML =
        '<div class="card-grid">' +
          summaryCard("dev", "Development", data.development) +
          summaryCard("maint", "Maintenance", data.maintenance) +
        '</div>' +

        '<div class="section-lbl dev"><span class="dot"></span>Development &mdash; ' + escapeHtml(data.development.count) + ' tugas</div>' +
        '<div class="table-wrap"><table class="tasks">' +
          '<thead><tr><th>#</th><th>Kategori</th><th>Tugas</th><th>Keterangan</th><th>Status</th></tr></thead>' +
          '<tbody>' + taskRows(data.development.rows, "dev", "Development") + '</tbody>' +
        '</table></div>' +

        '<div class="section-lbl maint"><span class="dot"></span>Maintenance &mdash; ' + escapeHtml(data.maintenance.count) + ' tugas</div>' +
        '<div class="table-wrap"><table class="tasks">' +
          '<thead><tr><th>#</th><th>Kategori</th><th>Tugas</th><th>Keterangan</th><th>Status</th></tr></thead>' +
          '<tbody>' + taskRows(data.maintenance.rows, "maint", "Maintenance") + '</tbody>' +
        '</table></div>' +

        '<div class="note">Ini laporan minggu berjalan (' + escapeHtml(data.week_range) + '). Untuk riwayat lengkap seluruh permintaan sejak awal proyek per nomor item, lihat <a href="' + escapeHtml(data.archive_url) + '">halaman arsip</a>.</div>' +

        '<div class="closing">' +
          '<div>Cabang <code>' + escapeHtml(data.branch) + '</code> &middot; total ' + totalTasks + ' tugas minggu ini.</div>' +
          '<div class="pass">' + escapeHtml(data.tests) + '</div>' +
        '</div>';
    })
    .catch(function (err) {
      root.innerHTML = '<div class="load-error">Laporan tidak bisa dimuat (' + escapeHtml(err.message) + '). Coba muat ulang halaman.</div>';
    });
})();
</script>

</body>
</html>
