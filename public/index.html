<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="/api/theme/runtime-config.js?v=20260423-design-studio"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="/assets/js/theme/tailwindcss.js"></script>
    <style>
      :root {
        --app-splash-base: #ffffff;
        --app-splash-deep: #f7f7f7;
        --app-splash-light: #ffffff;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 25% 20%, rgba(204, 176, 133, 0.16), transparent 30%),
          linear-gradient(125deg, var(--app-splash-deep), var(--app-splash-base), var(--app-splash-light), var(--app-splash-base));
        background-size: 100% 100%, 260% 260%;
        transition: opacity 260ms ease, visibility 260ms ease;
        animation: appSplashGradient 2.8s ease-in-out infinite;
      }

      #app-splash.is-hiding {
        visibility: hidden;
        opacity: 0;
      }

      #app-splash img {
        display: block;
        width: min(72vw, 420px);
        height: auto;
        filter: drop-shadow(0 18px 36px rgba(43, 108, 114, 0.18));
        animation: appSplashLogo 1.45s ease-in-out infinite;
      }

      @keyframes appSplashGradient {
        0%, 100% { background-position: center, 0% 50%; }
        50% { background-position: center, 100% 50%; }
      }

      @keyframes appSplashLogo {
        0%, 100% { transform: translateY(0) scale(1); opacity: 0.96; }
        50% { transform: translateY(-3px) scale(1.015); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash,
        #app-splash img {
          animation: none;
        }
      }

      @keyframes pbModalIn {
        from { opacity: 0; transform: translateY(10px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .modal-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: color-mix(in srgb, var(--pb-brand-secondary) 42%, transparent) transparent;
      }

      .modal-scrollbar::-webkit-scrollbar {
        width: 8px;
      }

      .modal-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .modal-scrollbar::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 999px;
        background: color-mix(in srgb, var(--pb-brand-secondary) 42%, transparent);
        background-clip: content-box;
      }
    </style>
    <script>
      (function () {
        var startedAt = Date.now();
        var minimumMs = 500;
        var maximumMs = Number("__APP_SPLASH_MAX_WAIT_MS__") || 1600;
        var hidden = false;

        window.AppSplash = {
          hide: function () {
            if (hidden) {
              return;
            }

            hidden = true;

            window.setTimeout(function () {
              var splash = document.getElementById("app-splash");

              if (!splash) {
                return;
              }

              splash.classList.add("is-hiding");
              window.setTimeout(function () {
                splash.remove();
              }, 320);
            }, Math.max(0, minimumMs - (Date.now() - startedAt)));
          },
        };

        window.setTimeout(function () {
          window.AppSplash.hide();
        }, Math.max(minimumMs, maximumMs));
      })();
    </script>
  </head>
  <body class="bg-gray-50 font-sans text-gray-950 antialiased">
    <div id="app-splash" role="status" aria-label="Memuat aplikasi">
      <img src="/assets/images/Logo_Siata_Mobilindo.svg" alt="Siata Mobilindo">
    </div>
    <div id="app"></div>
    <div id="modal-root" hidden></div>
    <div id="toast-root" aria-live="polite"></div>
    <script type="module" src="/assets/js/app.js?v=20260423-design-studio"></script>
  </body>
</html>
